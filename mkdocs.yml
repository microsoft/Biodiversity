site_name: Microsoft Biodiversity
site_url: https://microsoft.github.io/Biodiversity/
site_description: "Microsoft AI for Good Lab Biodiversity hub: open-source conservation AI for wildlife monitoring. Home of the SPARROW ecosystem, MegaDetector, Sparrow Engine and MegaDetector-Acoustic."
docs_dir: docs
site_dir: site
repo_url: https://github.com/microsoft/Biodiversity
repo_name: microsoft/Biodiversity
copyright: Copyright (c) 2023 Microsoft Corporation

theme:
  name: material
  custom_dir: overrides
  favicon: assets/cat.png
  logo: assets/cat.png
  icon:
    menu: material/menu
    alternate: material/translate
    search: material/magnify
    share: material/share-variant
    close: material/close
    top: material/arrow-up
    edit: material/pencil
    view: material/eye
    repo: fontawesome/brands/git-alt
    admonition:
      note: material/note
      abstract: material/lightbulb
      info: material/information
      tip: material/lightbulb-on
      success: material/check-circle
      question: material/help-circle
      warning: material/alert
      failure: material/alert-circle
      danger: material/alert-octagon
      bug: material/bug
      example: material/format-list-bulleted
      quote: material/format-quote-open
    tag:
      default: material/tag
      info: material/information
      warning: material/alert
      danger: material/alert-octagon
    previous: material/arrow-left
    next: material/arrow-right
  palette:
    - media: "(prefers-color-scheme: light)" 
      scheme: default
      primary: green
      accent: deep orange
      toggle:
        icon: material/paw-off
        name: Switch to dark mode
        
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/paw
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.path
    - toc.follow
    # - toc.integrate
    - navigation.top
    - search.suggest
    - search.share
    - navigation.footer

nav:
  - Home: index.md
  - Projects:
    - Project catalogue: ecosystem.md
    - MegaDetector: megadetector.md
    - MegaDetector-Acoustic: bioacoustics.md
  - Release history:
    - PyTorch-Wildlife 1.3.0: releases/release_notes.md
    - PyTorch-Wildlife past releases: releases/past_releases.md
  - Community:
    - Existing Collaborators: collaborators.md
    - Contributors: contributors.md
    - Cite Us: cite.md
    - Contribute: contribute.md
    - License: license.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - md_in_html
  - attr_list
  - sane_lists
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true


plugins:
  - callouts
  - search
  - meta
  - tags
  - git-revision-date-localized:
      type: date
      enable_creation_date: true
      fallback_to_build_date: true
  - redirects:
      redirect_maps:
        pytorch_wildlife.md: https://github.com/microsoft/SPARROW-Playground
        core_features.md: https://github.com/microsoft/SPARROW-Playground
        installation.md: https://github.com/microsoft/SPARROW-Playground#-sparrow-engine-in-five-lines
        tags.md: index.md
        build_mkdocs.md: contribute.md#build-the-docs
        pw_engine_overview.md: https://github.com/microsoft/SPARROW-Engine
        model_zoo/index.md: https://github.com/microsoft/SPARROW-Engine/blob/main/docs/model-zoo-catalogue.md
        model_zoo/megadetector.md: https://github.com/microsoft/SPARROW-Engine/blob/main/docs/model-zoo-catalogue.md#camera-trap--detector
        model_zoo/classifiers.md: https://github.com/microsoft/SPARROW-Engine/blob/main/docs/model-zoo-catalogue.md#camera-trap--classifier
